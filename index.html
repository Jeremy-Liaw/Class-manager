<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <title>家長日 Party｜食物分配系統</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #172033;
      --muted: #697386;
      --line: #e5e9f0;
      --primary: #315efb;
      --primary-dark: #2147d9;
      --danger: #d9363e;
      --success: #198754;
      --shadow: 0 8px 28px rgba(23,32,51,.08);
      --radius: 18px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    button, input { font: inherit; }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 50px;
    }

    .hero {
      background: linear-gradient(135deg, #172033, #2b3d68);
      color: white;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(25px, 5vw, 38px);
    }

    .hero p {
      margin: 5px 0;
      opacity: .9;
    }

    .status {
      margin-top: 16px;
      background: rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
    }

    .panel {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .panel h2 {
      margin: 0 0 15px;
      font-size: 21px;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .book-btn {
      border: 2px solid var(--line);
      background: white;
      border-radius: 16px;
      padding: 18px 10px;
      cursor: pointer;
      transition: .15s;
      color: var(--text);
    }

    .book-btn:hover { transform: translateY(-2px); }
    .book-btn.active {
      border-color: var(--primary);
      background: #eef2ff;
    }

    .book-emoji { font-size: 28px; }
    .book-name { font-weight: 800; margin-top: 8px; }
    .book-type { color: var(--muted); font-size: 14px; margin-top: 3px; }

    .hidden { display: none !important; }

    .selected-book {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .selected-book .emoji { font-size: 36px; }

    .selected-book strong {
      display: block;
      font-size: 20px;
    }

    .selected-book span { color: var(--muted); }

    .food-row {
      display: flex;
      gap: 10px;
    }

    .food-input {
      flex: 1;
      min-width: 0;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px 15px;
      outline: none;
      transition: .15s;
    }

    .food-input:focus { border-color: var(--primary); }

    .primary {
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      padding: 0 22px;
      cursor: pointer;
      min-height: 50px;
    }

    .primary:hover { background: var(--primary-dark); }
    .primary:disabled { opacity: .55; cursor: not-allowed; }

    .recommend-title {
      color: var(--muted);
      font-size: 14px;
      margin: 18px 0 9px;
    }

    .recommendations {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .recommend {
      border: 1px solid var(--line);
      background: #f8f9fb;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .recommend:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .my-card {
      border: 2px solid #dce5ff;
      background: #f5f7ff;
      border-radius: 15px;
      padding: 14px;
      margin-top: 16px;
    }

    .my-card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .my-food { font-weight: 800; font-size: 17px; }

    .actions {
      display: flex;
      gap: 7px;
    }

    .small-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 10px;
      padding: 8px 11px;
      cursor: pointer;
    }

    .delete-btn {
      color: var(--danger);
      border-color: #ffd6d8;
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding-bottom: 2px;
      margin-bottom: 16px;
    }

    .tab {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: white;
      padding: 9px 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .tab.active {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fafbfc;
    }

    .summary-item strong {
      display: block;
      font-size: 22px;
      margin-top: 4px;
    }

    .food-list {
      display: grid;
      gap: 9px;
    }

    .food-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .food-item-left {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .food-name {
      font-weight: 650;
      word-break: break-word;
    }

    .count {
      color: var(--muted);
      white-space: nowrap;
      font-size: 14px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 30px 10px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: #172033;
      color: white;
      padding: 12px 17px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 100;
      max-width: calc(100vw - 30px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .loading {
      position: fixed;
      inset: 0;
      background: rgba(244,246,249,.86);
      display: grid;
      place-items: center;
      z-index: 200;
      backdrop-filter: blur(4px);
    }

    .loading-box {
      background: white;
      padding: 20px 24px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      font-weight: 700;
    }

    .footer-note {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      margin-top: 18px;
    }

    @media (max-width: 760px) {
      .app { padding: 10px 10px 35px; }
      .hero { border-radius: 18px; padding: 22px 18px; }
      .panel { padding: 16px; border-radius: 16px; }
      .book-grid { grid-template-columns: repeat(2, 1fr); }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .food-row { flex-direction: column; }
      .primary { width: 100%; }
      .my-card-top { align-items: flex-start; flex-direction: column; }
      .actions { width: 100%; }
      .small-btn { flex: 1; }
    }
  </style>
</head>

<body>
  <div id="loading" class="loading">
    <div class="loading-box">正在載入家長日 Party…</div>
  </div>

  <main class="app">
    <section class="hero">
      <h1>🍽️ 家長日 Party</h1>
      <p>食物分配系統</p>
      <p>活動日期：2026 / 10 / 02</p>
      <div id="status" class="status">正在連線到食物清單…</div>
    </section>

    <section class="panel">
      <h2>① 選擇你的書院</h2>
      <div id="bookGrid" class="book-grid"></div>
    </section>

    <section id="entryPanel" class="panel hidden">
      <h2>② 登記你要帶的食物</h2>

      <div id="selectedBook" class="selected-book"></div>

      <div class="food-row">
        <input id="foodInput" class="food-input" maxlength="100"
               placeholder="例如：蛤蜊義大利麵"
               autocomplete="off">
        <button id="saveBtn" class="primary">登記食物</button>
      </div>

      <div class="recommend-title">💡 推薦項目（點一下即可填入）</div>
      <div id="recommendations" class="recommendations"></div>

      <div id="myRecord"></div>
    </section>

    <section class="panel">
      <h2>③ 大家目前帶什麼？</h2>

      <div id="summary" class="summary"></div>

      <div id="tabs" class="tabs"></div>

      <div id="foodList" class="food-list"></div>
    </section>

    <div class="footer-note">
      資料會同步到活動主辦方的 Google Sheet。
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const state = {
      data: null,
      selectedBook: '',
      activeTab: '全部',
      myRecordKey: localStorage.getItem('party_record_key') || ''
    };

    function makeDeviceKey() {
      // 只作為瀏覽器內部辨認自己的資料，不顯示給使用者。
      if (!state.myRecordKey) {
        state.myRecordKey =
          'r_' + Date.now().toString(36) + '_' +
          Math.random().toString(36).slice(2, 12);
        localStorage.setItem('party_record_key', state.myRecordKey);
      }
      return state.myRecordKey;
    }

    function init() {
      makeDeviceKey();

      google.script.run
        .withSuccessHandler(data => {
          state.data = data;
          renderAll();
          document.getElementById('loading').classList.add('hidden');
        })
        .withFailureHandler(handleError)
        .getInitialData();
    }

    function renderAll() {
      renderBooks();
      renderEntry();
      renderSummary();
      renderTabs();
      renderFoodList();
      updateStatus();
    }

    function renderBooks() {
      const grid = document.getElementById('bookGrid');
      grid.innerHTML = '';

      Object.entries(state.data.books).forEach(([book, info]) => {
        const btn = document.createElement('button');
        btn.className = 'book-btn' + (state.selectedBook === book ? ' active' : '');
        btn.innerHTML = `
          <div class="book-emoji">${info.emoji}</div>
          <div class="book-name">${book}</div>
          <div class="book-type">${info.type}餐點</div>
        `;
        btn.onclick = () => {
          state.selectedBook = book;
          state.activeTab = book;
          renderAll();
          document.getElementById('foodInput').focus();
        };
        grid.appendChild(btn);
      });
    }

    function renderEntry() {
      const panel = document.getElementById('entryPanel');

      if (!state.selectedBook) {
        panel.classList.add('hidden');
        return;
      }

      panel.classList.remove('hidden');

      const info = state.data.books[state.selectedBook];
      document.getElementById('selectedBook').innerHTML = `
        <div class="emoji">${info.emoji}</div>
        <div>
          <strong>${state.selectedBook}書院</strong>
          <span>${info.type}餐點</span>
        </div>
      `;

      const recommendations = document.getElementById('recommendations');
      recommendations.innerHTML = '';

      info.recommendations.forEach(food => {
        const btn = document.createElement('button');
        btn.className = 'recommend';
        btn.textContent = food;
        btn.onclick = () => {
          document.getElementById('foodInput').value = food;
          document.getElementById('foodInput').focus();
        };
        recommendations.appendChild(btn);
      });

      const myRecord = state.data.records.find(r => r.recordKey === state.myRecordKey);

      document.getElementById('myRecord').innerHTML = myRecord ? `
        <div class="my-card">
          <div class="my-card-top">
            <div>
              <div style="font-size:13px;color:#697386;">你目前的登記</div>
              <div class="my-food">${escapeHtml(myRecord.food)}</div>
            </div>
            <div class="actions">
              <button class="small-btn" onclick="editMyRecord()">✏️ 編輯</button>
              <button class="small-btn delete-btn" onclick="deleteMyRecord()">🗑️ 刪除</button>
            </div>
          </div>
        </div>
      ` : '';
    }

    function renderSummary() {
      const summary = document.getElementById('summary');
      summary.innerHTML = '';

      Object.entries(state.data.books).forEach(([book, info]) => {
        const count = state.data.records.filter(r => r.book === book).length;

        const div = document.createElement('div');
        div.className = 'summary-item';
        div.innerHTML = `
          <span>${info.emoji} ${book}</span>
          <strong>${count} 份</strong>
          <span style="font-size:13px;color:#697386;">${info.type}</span>
        `;
        summary.appendChild(div);
      });
    }

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';

      const all = document.createElement('button');
      all.className = 'tab' + (state.activeTab === '全部' ? ' active' : '');
      all.textContent = '全部';
      all.onclick = () => {
        state.activeTab = '全部';
        renderTabs();
        renderFoodList();
      };
      tabs.appendChild(all);

      Object.entries(state.data.books).forEach(([book, info]) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (state.activeTab === book ? ' active' : '');
        btn.textContent = `${info.emoji} ${book}`;
        btn.onclick = () => {
          state.activeTab = book;
          renderTabs();
          renderFoodList();
        };
        tabs.appendChild(btn);
      });
    }

    function renderFoodList() {
      const list = document.getElementById('foodList');

      let records = state.data.records;
      if (state.activeTab !== '全部') {
        records = records.filter(r => r.book === state.activeTab);
      }

      const groups = new Map();

      records.forEach(r => {
        const key = `${r.book}|||${r.food}`;
        if (!groups.has(key)) {
          groups.set(key, {
            book: r.book,
            food: r.food,
            count: 0
          });
        }
        groups.get(key).count++;
      });

      if (groups.size === 0) {
        list.innerHTML = '<div class="empty">目前還沒有人登記食物。</div>';
        return;
      }

      list.innerHTML = '';

      [...groups.values()].forEach(item => {
        const info = state.data.books[item.book];

        const div = document.createElement('div');
        div.className = 'food-item';
        div.innerHTML = `
          <div class="food-item-left">
            <span>${info.emoji}</span>
            <span class="food-name">${escapeHtml(item.food)}</span>
          </div>
          <span class="count">${item.count} 人</span>
        `;
        list.appendChild(div);
      });
    }

    function updateStatus() {
      const total = state.data.records.length;
      document.getElementById('status').textContent =
        `目前共有 ${total} 筆登記。選擇書院後，就可以開始登記食物。`;
    }

    function saveFood() {
      const input = document.getElementById('foodInput');
      const food = input.value.trim();

      if (!state.selectedBook) {
        showToast('請先選擇書院');
        return;
      }

      if (!food) {
        showToast('請先輸入或選擇食物');
        input.focus();
        return;
      }

      const duplicate = state.data.records.some(
        r => r.food.trim().toLowerCase() === food.toLowerCase()
      );

      if (duplicate) {
        const ok = confirm(
          `「${food}」目前已經有人登記了。\n\n仍然要登記這項食物嗎？`
        );
        if (!ok) return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = '送出中…';

      google.script.run
        .withSuccessHandler(result => {
          state.data.records = result.records;
          input.value = '';
          btn.disabled = false;
          btn.textContent = '登記食物';
          renderAll();
          showToast('✅ 食物登記成功！');
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.textContent = '登記食物';
          handleError(err);
        })
        .saveFood({
          recordKey: state.myRecordKey,
          book: state.selectedBook,
          food: food
        });
    }

    function editMyRecord() {
      const record = state.data.records.find(
        r => r.recordKey === state.myRecordKey
      );
      if (!record) return;

      state.selectedBook = record.book;
      renderAll();

      const input = document.getElementById('foodInput');
      input.value = record.food;
      input.focus();
      input.select();

      window.scrollTo({
        top: document.getElementById('entryPanel').offsetTop - 10,
        behavior: 'smooth'
      });
    }

    function deleteMyRecord() {
      const record = state.data.records.find(
        r => r.recordKey === state.myRecordKey
      );
      if (!record) return;

      const ok = confirm(
        `確定要刪除「${record.food}」嗎？`
      );
      if (!ok) return;

      google.script.run
        .withSuccessHandler(result => {
          state.data.records = result.records;
          showToast('已刪除你的登記');
          renderAll();
        })
        .withFailureHandler(handleError)
        .deleteFood(state.myRecordKey);
    }

    function handleError(err) {
      console.error(err);
      document.getElementById('loading').classList.add('hidden');
      showToast('⚠️ 系統發生錯誤：' + (err && err.message ? err.message : err));
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(
        () => toast.classList.remove('show'),
        2800
      );
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    document.getElementById('saveBtn').addEventListener('click', saveFood);

    document.getElementById('foodInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') saveFood();
    });

    window.addEventListener('load', init);
  </script>
</body>
</html>
