<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的每週課表｜第 2–20 週</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17212b;--muted:#667085;--line:#dfe4ea;--today:#fff4bf;--current:#d9f7e7;--empty:#f8fafc;--shadow:0 10px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1250px;margin:auto;padding:24px 18px 40px}header{margin-bottom:18px}h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px}.sub{color:var(--muted);font-size:14px}
.status{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin:16px 0;display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.label{font-size:12px;color:var(--muted);margin-bottom:4px}.big{font-size:20px;font-weight:750}.next{font-size:16px;font-weight:650}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0}.btns{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:10px;font-weight:650;cursor:pointer}button:hover{background:#f8fafc}button:disabled{opacity:.4;cursor:not-allowed}
.week-title{font-weight:750;font-size:18px}.notice{display:none;padding:12px 15px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:14px}
.table-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:850px}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;vertical-align:middle}
th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}thead th{background:#f8fafc;position:sticky;top:0;z-index:2;text-align:center}
.time{width:125px;background:#fafafa;font-weight:700;text-align:center;white-space:pre-line}.day-head{min-width:145px}.day-head.today{background:var(--today);box-shadow:inset 0 -3px 0 #eab308}.day-head .date{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.cell{min-height:58px;line-height:1.45;text-align:center;font-size:14px}.empty{color:#98a2b3;background:var(--empty)}.today-col{background:linear-gradient(0deg,rgba(255,244,191,.28),rgba(255,244,191,.28))}
.current{background:var(--current)!important;outline:3px solid #22c55e;outline-offset:-3px;font-weight:750;position:relative}.current::after{content:"現在";position:absolute;top:5px;right:5px;font-size:10px;background:#16a34a;color:white;border-radius:99px;padding:2px 5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:12px}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:12px;height:12px;border-radius:4px;border:1px solid #ddd;display:inline-block}
.mobile-day-tabs{display:none}.day-tab{font-size:12px;padding:8px 7px}.day-tab small{display:block;color:var(--muted);font-weight:500;margin-top:2px}.day-tab.active{background:#eef2ff;border-color:#818cf8;color:#3730a3}.day-tab.is-today{box-shadow:inset 0 -3px 0 #eab308}.view-mode{display:inline-flex;margin:0 0 8px;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:700}.mobile-schedule{display:none}.mobile-day{border-bottom:1px solid var(--line);padding:14px 12px}.mobile-day:last-child{border-bottom:0}.mobile-day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-weight:750}.mobile-day.today{background:linear-gradient(0deg,rgba(255,244,191,.38),rgba(255,244,191,.38))}.mobile-day.today .mobile-day-head{color:#92400e}.mobile-item{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:9px 8px;margin:5px 0;border-radius:10px;background:#f8fafc}.mobile-item.current{background:var(--current)!important}.mobile-time{font-size:12px;color:var(--muted);font-weight:700}.mobile-class{font-size:14px;line-height:1.4;font-weight:650}.mobile-empty{color:#98a2b3;font-weight:500}.mobile-badge{display:inline-block;margin-left:5px;font-size:10px;background:#16a34a;color:#fff;border-radius:99px;padding:2px 5px;vertical-align:middle}.mobile-tip{padding:12px;color:var(--muted);font-size:13px;text-align:center;background:#f8fafc}@media(max-width:700px){.wrap{padding:16px 10px 30px}.status{grid-template-columns:1fr}.big{font-size:18px}.table-card{overflow:visible}.table-card table{display:none}.mobile-schedule{display:block}.mobile-day-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}.view-mode{background:#dcfce7;color:#166534}.controls{position:sticky;bottom:8px;z-index:5;background:rgba(244,246,248,.94);padding:8px;border-radius:14px;backdrop-filter:blur(8px)}button{padding:10px 12px}.btns{width:100%}.btns button{flex:1}}

.task-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.task-panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);position:sticky;top:16px}
.task-panel h2{font-size:16px;margin:0 0 6px}.task-help{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.task-palette{display:grid;gap:10px}.task-block{min-height:58px;border:2px dashed #94a3b8;border-radius:12px;background:#fff;padding:10px;cursor:grab;user-select:none;touch-action:none}
.task-block:active{cursor:grabbing}.task-block .block-title{font-weight:750;font-size:14px}.task-block .block-sub{font-size:11px;color:var(--muted);margin-top:4px}
.task-selected{outline:3px solid #818cf8;outline-offset:2px}.drop-target{outline:3px dashed #6366f1!important;outline-offset:-3px;background:#eef2ff!important}.custom-task{background:#ede9fe!important;border:1px solid #a78bfa!important;font-weight:700;position:relative}.custom-task .task-location{display:block;font-size:11px;color:#6d28d9;margin-top:3px;font-weight:600}.remove-task{display:inline-flex;border:0;background:transparent;color:#7c3aed;padding:2px 4px;margin-left:4px;font-size:11px;cursor:pointer}
.task-tip{font-size:11px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.export-row{display:flex;gap:8px;flex-wrap:wrap}.export-btn{background:#111827;color:#fff;border-color:#111827}.export-btn:hover{background:#1f2937}
.mobile-task-panel{display:none}
@media(max-width:900px){.task-layout{grid-template-columns:1fr}.task-panel{position:static}.task-palette{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.task-layout{display:block}.task-panel{margin-bottom:12px}.task-panel h2{font-size:15px}.task-palette{grid-template-columns:repeat(2,1fr)}}
</style>

 document.getElementById("bodyRows").innerHTML=w.periods.map((p,pi)=>`<tr><td class="time">${p.no}\n${p.time}</td>${p.cells.map((_,di)=>renderCell(w,pi,di,today,todayIdx)).join("")}</tr>`).join("");
 const mobile=document.getElementById("mobileSchedule"),autoDay=todayIdx>=0?todayIdx:0;
 if(!window.__mobileDayInitialized){selectedDay=autoDay;window.__mobileDayInitialized=true}
 selectedDay=Math.max(0,Math.min(4,selectedDay));const di=selectedDay,date=w.dates[di],isToday=date===today;
 const items=w.periods.map((p,pi)=>{
   const base=String(p.cells[di]||"空堂").trim(),custom=getTasks()[taskKey(date,pi)],isCurrent=isToday&&pi===currentPeriodIndex(new Date()),empty=isEmptySlot(w,pi,di);
   const cls=`mobile-item ${isCurrent?"current ":""}${custom?"custom-task ":""}`;
   const content=custom?taskHtml({...custom,_key:taskKey(date,pi)}):escapeHtml(base);
   return `<div class="${cls}" ${empty?`data-date="${date}" data-period="${pi}" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondrop="dropTask(event)" onclick="tapEmptySlot('${date}',${pi})"`:""}><div class="mobile-time">第 ${p.no} 節<br>${p.time}</div><div class="mobile-class ${empty?"mobile-empty":""}">${content}${isCurrent?'<span class="mobile-badge">現在</span>':''}</div></div>`;
 }).join("");
 mobile.innerHTML=`<div class="mobile-day-tabs">${dayNames.map((n,i)=>`<button class="day-tab ${i===selectedDay?"active":""} ${w.dates[i]===today?"is-today":""}" onclick="selectMobileDay(${i})">${n}<small>${dateLabel(w.dates[i])}</small></button>`).join("")}</div><section class="mobile-day ${isToday?"today":""}"><div class="mobile-day-head"><span>${dayNames[di]}</span><span>${dateLabel(date)}${isToday?' · 今天':''}</span></div>${items}</section>`;
 const isMobile=window.matchMedia("(max-width:700px)").matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
 document.getElementById("viewMode").textContent=isMobile?"📱 手機模式（自動切換）":"🖥️ 桌面模式";
 updateStatus();
}
function selectMobileDay(i){selectedDay=i;render()}
function changeWeek(delta){selectedWeek=Math.max(0,Math.min(weeks.length-1,selectedWeek+delta));const today=localDateISO(new Date()),wi=findWeekIndex(today);selectedDay=selectedWeek===wi?getWeekdayIndex(new Date()):0;render()}
function goToday(){const now=new Date(),wi=getNearestWeekIndexForDate(now);selectedWeek=wi;selectedDay=getWeekdayIndex(now)>=0?getWeekdayIndex(now):0;render()}
function selectTaskBlock(el){selectedBlock=!selectedBlock;document.querySelectorAll(".task-block").forEach(x=>x.classList.remove("task-selected"));if(selectedBlock)el.classList.add("task-selected")}
function dragStart(e){selectedBlock=true;e.dataTransfer.effectAllowed="copy";e.dataTransfer.setData("text/plain","blank")}
function allowDrop(e){if(isEmptySlot(weeks[selectedWeek],Number(e.currentTarget.dataset.period),wDayIndex(e.currentTarget.dataset.date)))e.preventDefault()}
function wDayIndex(date){return weeks[selectedWeek].dates.indexOf(date)}
function dragEnter(e){if(isEmptySlot(weeks[selectedWeek],Number(e.currentTarget.dataset.period),wDayIndex(e.currentTarget.dataset.date)))e.currentTarget.classList.add("drop-target")}
function dragLeave(e){e.currentTarget.classList.remove("drop-target")}
function dropTask(e){e.preventDefault();e.currentTarget.classList.remove("drop-target");const date=e.currentTarget.dataset.date,pi=Number(e.currentTarget.dataset.period),di=wDayIndex(date);if(isEmptySlot(weeks[selectedWeek],pi,di))createTask(date,pi)}
function tapEmptySlot(date,pi){if(!selectedBlock)return;const di=weeks[selectedWeek].dates.indexOf(date);if(isEmptySlot(weeks[selectedWeek],pi,di))createTask(date,pi)}
function createTask(date,pi){
 const name=prompt("請輸入任務名稱：","自主學習");if(!name||!name.trim())return;
 const location=prompt("上課／活動地點（可留空）：","");const tasks=getTasks();tasks[taskKey(date,pi)]={name:name.trim(),location:(location||"").trim()};saveTasks(tasks);selectedBlock=false;document.querySelectorAll(".task-block").forEach(x=>x.classList.remove("task-selected"));render();
}
function removeTask(key){const tasks=getTasks();delete tasks[key];saveTasks(tasks);render()}
// ---- 週計畫 xlsx 範本匯出 ----
// 範本工作表中，每節課對應「課程列」與「地點列」的實際 row 編號（第 5 節前有午休，不在此列）
const TEMPLATE_ROW_MAP=[[5,6],[7,8],[9,10],[11,12],[14,15],[16,17],[18,19],[20,21]];
const TEMPLATE_COLS=["C","D","E","F","G"];
function base64ToUint8Array(b64){
 const bin=atob(b64);const arr=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
 return arr;
}
// 在 sheet1.xml 原始字串中，把指定儲存格（例如 "C5"）改成內嵌字串 text，
// 保留該儲存格原本的樣式（s="..."），格式與位置完全不變。
function setCellInline(xml,ref,text){
 const re=new RegExp('<c r="'+ref+'"([^>]*?)(/>|>[\\s\\S]*?</c>)');
 const m=re.exec(xml);
 if(!m)return xml;
 const sMatch=m[1].match(/\ss="(\d+)"/);
 const sAttr=sMatch?` s="${sMatch[1]}"`:"";
 const esc=String(text??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 const newCell=`<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${esc}</t></is></c>`;
 return xml.slice(0,m.index)+newCell+xml.slice(m.index+m[0].length);
}
async function exportWeeklyPlan(){
 const btn=event?event.currentTarget:null; if(btn){btn.disabled=true;btn.dataset.origText=btn.textContent;btn.textContent="匯出中…";}
 try{
   const w=weeks[selectedWeek],tasks=getTasks();
   const zip=await JSZip.loadAsync(base64ToUint8Array(TEMPLATE_XLSX_BASE64));
   let xml=await zip.file("xl/worksheets/sheet1.xml").async("string");
   // 週次標題（維持範本格式：第X週　起始日～結束日）
   xml=setCellInline(xml,"A3",`第${w.week}週  ${dateLabel(w.dates[0])}～${dateLabel(w.dates[4])}`);
   // 星期標頭日期
   TEMPLATE_COLS.forEach((col,di)=>{xml=setCellInline(xml,`${col}4`,`星期${dayNames[di].slice(2)}\n${dateLabel(w.dates[di])}`)});
   // 每節課的課程／地點
   w.periods.forEach((p,pi)=>{
     const [courseRow,locRow]=TEMPLATE_ROW_MAP[pi];
     TEMPLATE_COLS.forEach((col,di)=>{
       const base=String(p.cells[di]||"空堂").trim();
       const custom=tasks[taskKey(w.dates[di],pi)];
       let courseText=null,locText=null;
       if(custom){courseText=custom.name;locText=custom.location||"";}
       else if(base!=="空堂"){courseText=base;}
       if(courseText!==null)xml=setCellInline(xml,`${col}${courseRow}`,courseText);
       if(locText)xml=setCellInline(xml,`${col}${locRow}`,locText);
     });
   });
   zip.file("xl/worksheets/sheet1.xml",xml);
   const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
   const a=document.createElement("a");a.href=URL.createObjectURL(blob);
   a.download=`第${w.week}週_週計畫_${dateLabel(w.dates[0])}-${dateLabel(w.dates[4])}.xlsx`.replace(/\//g,"");
   a.click();URL.revokeObjectURL(a.href);
   alert("已匯出本週週計畫（與紙本週計畫表相同格式的 Excel 檔）。固定課程已自動填入；你在網頁上安排的空堂任務也會一併填入課程／地點欄位，尚未安排的空堂則保留空白讓你自己填寫。");
 }catch(err){
   console.error(err);
   alert("匯出失敗，請稍後再試一次。");
 }finally{
   if(btn){btn.disabled=false;btn.textContent=btn.dataset.origText;}
 }
}
function init(){const now=new Date();selectedWeek=getNearestWeekIndexForDate(now);selectedDay=getWeekdayIndex(now)>=0?getWeekdayIndex(now):0;render();setInterval(render,30000)}
init();
