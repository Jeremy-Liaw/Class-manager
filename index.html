function localDateISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function dateLabel(iso){const d=new Date(iso+"T00:00:00");return `${d.getMonth()+1}/${d.getDate()}`}

function parseTime(s){const [h,m]=s.split(":").map(Number);return h*60+m}
function currentPeriodIndex(now){const mins=now.getHours()*60+now.getMinutes();for(let i=0;i<periodRanges.length;i++)if(mins>=parseTime(periodRanges[i][0])&&mins<parseTime(periodRanges[i][1]))return i;return -1}
function isMeaningful(v){const s=String(v||"").trim();return s&&s!=="空堂"&&!s.startsWith("無課")}
function getWeekdayIndex(d){const n=d.getDay();return n===0||n===6?-1:n-1}
function updateStatus(){

 const current=document.getElementById("currentClass"),next=document.getElementById("nextClass"),label=document.getElementById("statusLabel");

 else{label.textContent="今天";current.textContent="今天課程已結束";next.textContent="明天再見！"}
